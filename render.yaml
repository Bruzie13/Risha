services:
  - type: web
    name: risha-backend
    runtime: node
    repo: https://github.com/Bruzie13/Risha
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js

  - type: web
    name: risha-ml
    runtime: python
    repo: https://github.com/Bruzie13/Risha
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
