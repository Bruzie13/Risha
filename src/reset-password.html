<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="description" content="Reset your FETCH account password.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FETCH · Risha Pet Supplies">
    <meta property="og:title" content="FETCH · Reset Password">
    <meta property="og:description" content="Reset your FETCH account password.">
    <meta property="og:url" content="https://risha-pets.onrender.com/reset-password.html">
    <meta property="og:image" content="https://risha-pets.onrender.com/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Risha Pet Supplies logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETCH · Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css?v=50">
    <style>
        /* The pages outside the sign-in wall share one look: the brand's deep
           blue, and a single white card with the one thing to do. */
        .auth-card { width: 100%; max-width: 420px; background: var(--bg-card); border-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); padding: 30px; }
        .auth-card h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
        .auth-card .lead, .auth-head p { font-size: 14px; color: var(--text-muted); margin: 4px 0 20px; line-height: 1.5; }
        .auth-badge { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; background: var(--primary-bg); color: var(--primary); }
        .auth-badge.ok, .auth-badge.success { background: var(--success-bg); color: var(--success); }
        .auth-badge.err, .auth-badge.error { background: var(--danger-bg); color: var(--danger); }
        .auth-card .form-group { margin-bottom: 16px; }
        .auth-card label { display: block; font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .auth-card .form-input { width: 100%; min-height: 44px; font-size: 15px; }
        .auth-hint { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: -4px 0 18px; }
        .auth-card .reset-btn, .auth-card .verify-btn {
            display: flex; width: 100%; min-height: 46px; align-items: center; justify-content: center;
            background: var(--primary); border: 1px solid var(--primary-dark); border-radius: var(--radius-md);
            color: #fff; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), var(--control-shadow);
        }
        .auth-card .reset-btn:hover, .auth-card .verify-btn:hover { background: var(--primary-dark); }
        .auth-card .reset-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .auth-msg, .reset-msg { display: none; border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
        .reset-msg.ok, .reset-msg.success { display: block; background: var(--success-bg); color: var(--success); }
        .reset-msg.err, .reset-msg.error { display: block; background: var(--danger-bg); color: var(--danger); }
        .back-link { margin-top: 18px; text-align: center; font-size: 14px; }
        .back-link a { color: var(--primary); font-weight: 600; text-underline-offset: 3px; }
        .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--bg-inset); border-top-color: var(--primary); animation: authSpin 0.8s linear infinite; margin: 4px 0 8px; }
        @keyframes authSpin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    </style>
    <script>/* standalone public page — always light-themed */document.documentElement.classList.remove('dark-mode');</script>
    <link rel="stylesheet" href="css/system.css?v=30">
</head>
<body class="auth-page">
    <div class="auth-wrap">
        <div class="login-brand">
            <img src="images/logo.jpeg" alt="Risha Pet Supplies">
            <div>
                <div class="login-brand-name">Risha Pet Supplies</div>
                <div class="login-brand-sub">FETCH inventory and sales</div>
            </div>
        </div>

    <main class="auth-card">
        <div class="reset-body">
            <div class="auth-head">
                <div class="auth-badge"><span class="material-symbols-outlined" style="font-size:24px;">lock_reset</span></div>
                <h1>Choose a new password</h1>
                <p>For your FETCH account at Risha Pet Supplies.</p>
            </div>
            <div class="reset-msg" id="resetMsg"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label>New password</label>
                    <input type="password" class="form-input" id="newPassword" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm password</label>
                    <input type="password" class="form-input" id="confirmPassword" required autocomplete="new-password">
                </div>
                <p class="auth-hint">At least 6 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</p>
                <button type="submit" class="reset-btn" id="resetBtn">Save new password</button>
            </form>
            <div class="back-link"><a href="login.html">&larr; Back to sign in</a></div>
        </div>
    </main>
    </div>
    <script>
        var API_BASE = '/api';
        var token = new URLSearchParams(window.location.search).get('token');
        var msg = document.getElementById('resetMsg');
        var form = document.getElementById('resetForm');
        var btn = document.getElementById('resetBtn');

        function show(text, kind) {
            msg.textContent = text;
            msg.className = 'reset-msg ' + kind;
        }

        if (!token) {
            show('This reset link is missing its token. Please use the link from your email, or request a new one from the sign-in page.', 'err');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var pw = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            msg.className = 'reset-msg';

            if (pw !== confirm) {
                show('Passwords do not match.', 'err');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';
            try {
                var res = await fetch(API_BASE + '/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: pw })
                });
                var data = await res.json();
                if (data.success) {
                    show(data.message + ' Redirecting to sign in...', 'ok');
                    form.style.display = 'none';
                    setTimeout(function () { window.location.href = 'login.html'; }, 2500);
                } else {
                    show(data.message || 'Could not reset password.', 'err');
                }
            } catch (err) {
                show('Connection error. Please try again.', 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
