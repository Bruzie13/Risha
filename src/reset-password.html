<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETCH · Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css?v=10">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDD 45%, #FDE4CE 100%);
            font-family: 'Inter', sans-serif;
        }
        .reset-card {
            width: 90%;
            max-width: 440px;
            background: #FFFDF9;
            border-radius: var(--radius-xl);
            box-shadow: 0 24px 80px rgba(224, 101, 91, 0.14);
            overflow: hidden;
            position: relative;
            animation: slideUp 0.6s ease;
        }
        .shop-awning {
            position: relative;
            height: 18px;
            background: repeating-linear-gradient(90deg, #EE6A5F 0 40px, #FFF6EE 40px 80px);
        }
        .shop-awning::after {
            content: '';
            position: absolute;
            top: 18px; left: 0; right: 0;
            height: 13px;
            background-image:
                radial-gradient(circle at 20px 0px, #EE6A5F 12px, transparent 12.5px),
                radial-gradient(circle at 60px 0px, #FFF6EE 12px, transparent 12.5px);
            background-size: 80px 13px;
            background-repeat: repeat-x;
            filter: drop-shadow(0 2px 3px rgba(224, 101, 91, 0.18));
            z-index: 2;
        }
        .reset-body { padding: 38px 34px 34px; }
        .reset-head { text-align: center; margin-bottom: 22px; }
        .reset-head .paw-badge {
            width: 54px; height: 54px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FFB09E, #EE6A5F);
            display: flex; align-items: center; justify-content: center;
            color: white;
        }
        .reset-head h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
        }
        .reset-head p { font-size: 14px; color: var(--text-secondary); margin: 6px 0 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .input-icon-wrap { position: relative; }
        .input-icon-wrap .input-icon {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px; z-index: 2; pointer-events: none;
        }
        .input-icon-wrap .form-input {
            padding: 11px 14px 11px 44px;
            background: var(--gray-50);
            border: 1.5px solid var(--border-glass-strong);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .input-icon-wrap .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
            background: #FFFDF9;
            outline: none;
        }
        .pw-hint { font-size: 12px; color: var(--text-muted); margin: -6px 0 16px; line-height: 1.5; }
        .reset-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #F28B82, #E0655B);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .reset-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255, 181, 167, 0.35); }
        .reset-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .reset-msg {
            display: none;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .reset-msg.ok { display: block; background: #E7F6EC; color: #1E7A3C; }
        .reset-msg.err { display: block; background: var(--danger-bg); color: var(--danger); }
        .back-link { text-align: center; margin-top: 18px; }
        .back-link a {
            color: var(--primary-dark, #E14C42);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link a:hover { text-decoration: underline; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>/* standalone public page — always light-themed */document.documentElement.classList.remove('dark-mode');</script>
</head>
<body>
    <div class="reset-card">
        <div class="shop-awning" aria-hidden="true"></div>
        <div class="reset-body">
            <div class="reset-head">
                <div class="paw-badge"><span class="material-symbols-outlined" style="font-size:28px;">pets</span></div>
                <h1>Choose a new password</h1>
                <p>for your FETCH · Risha Pet Supplies account</p>
            </div>
            <div class="reset-msg" id="resetMsg"></div>
            <form id="resetForm">
                <div class="form-group">
                    <label>New password</label>
                    <div class="input-icon-wrap">
                        <span class="input-icon"><span class="material-symbols-outlined" style="font-size:18px;">lock</span></span>
                        <input type="password" class="form-input" id="newPassword" placeholder="Enter new password" required autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm password</label>
                    <div class="input-icon-wrap">
                        <span class="input-icon"><span class="material-symbols-outlined" style="font-size:18px;">lock_reset</span></span>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
                    </div>
                </div>
                <p class="pw-hint">At least 6 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</p>
                <button type="submit" class="reset-btn" id="resetBtn">Reset Password</button>
            </form>
            <div class="back-link"><a href="login.html">&larr; Back to sign in</a></div>
        </div>
    </div>
    <script>
        var API_BASE = '/api';
        var token = new URLSearchParams(window.location.search).get('token');
        var msg = document.getElementById('resetMsg');
        var form = document.getElementById('resetForm');
        var btn = document.getElementById('resetBtn');

        function show(text, kind) {
            msg.textContent = text;
            msg.className = 'reset-msg ' + kind;
        }

        if (!token) {
            show('This reset link is missing its token. Please use the link from your email, or request a new one from the sign-in page.', 'err');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var pw = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            msg.className = 'reset-msg';

            if (pw !== confirm) {
                show('Passwords do not match.', 'err');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';
            try {
                var res = await fetch(API_BASE + '/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: pw })
                });
                var data = await res.json();
                if (data.success) {
                    show(data.message + ' Redirecting to sign in...', 'ok');
                    form.style.display = 'none';
                    setTimeout(function () { window.location.href = 'login.html'; }, 2500);
                } else {
                    show(data.message || 'Could not reset password.', 'err');
                }
            } catch (err) {
                show('Connection error. Please try again.', 'err');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
