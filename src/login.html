    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDD 45%, #FDE4CE 100%);
            font-family: 'Inter', sans-serif;
        }
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
        }
        .login-container {
            display: flex;
            width: 90%;
            max-width: 900px;
            min-height: 500px;
            background: #FFFDF9;
            border-radius: var(--radius-xl);
            box-shadow: 0 24px 80px color-mix(in srgb, var(--primary) 14%, transparent);
            overflow: hidden;
            position: relative;
            animation: slideUp 0.6s ease;
        }
        .shop-awning {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 18px;
            z-index: 3;
            background: repeating-linear-gradient(90deg, var(--primary) 0 40px, color-mix(in srgb, var(--primary) 8%, #fff) 40px 80px);
            pointer-events: none;
        }
        .shop-awning::after {
            content: '';
            position: absolute;
            top: 18px; left: 0; right: 0;
            height: 13px;
            background-image:
                radial-gradient(circle at 20px 0px, var(--primary) 12px, transparent 12.5px),
                radial-gradient(circle at 60px 0px, color-mix(in srgb, var(--primary) 8%, #fff) 12px, transparent 12.5px);
            background-size: 80px 13px;
            background-repeat: repeat-x;
            filter: drop-shadow(0 2px 3px color-mix(in srgb, var(--primary) 18%, transparent));
        }
        .login-brand {
            flex: 1;
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--primary) 55%, #fff) 0%,
                color-mix(in srgb, var(--primary) 80%, #fff) 55%,
                var(--primary) 100%);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-brand::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.18;
            pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><g fill='%23FFFFFF'><ellipse cx='45' cy='52' rx='12' ry='9'/><ellipse cx='31' cy='38' rx='5.2' ry='6.6'/><ellipse cx='45' cy='30' rx='5.6' ry='7'/><ellipse cx='59' cy='38' rx='5.2' ry='6.6'/><ellipse cx='38' cy='34' rx='4.6' ry='6' transform='rotate(-18 38 34)'/></g></svg>");
            background-size: 90px 90px;
            background-position: 0 0;
        }
        .pet-illustration {
            position: absolute;
            right: -6px;
            bottom: -8px;
            width: 128px;
            height: auto;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.15));
            opacity: 0.97;
            pointer-events: none;
        }
        @media (min-height: 720px) {
            .pet-illustration { width: 168px; bottom: -10px; }
        }
        .login-brand .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-brand .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .login-brand h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #4A2420;
            letter-spacing: -0.5px;
            line-height: 1.25;
            text-shadow: 0 1px 0 rgba(255,255,255,0.25);
            position: relative;
            z-index: 2;
        }
        .login-brand h1 span { color: rgba(74,36,32,0.75); font-weight: 600; }
        .login-brand p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.6;
            max-width: 280px;
        }
        .login-brand .brand-features {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .login-brand .brand-features .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            font-weight: 500;
        }
        .login-brand .brand-features .feature .f-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .login-form-wrap {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form-wrap .welcome-text {
            margin-bottom: 28px;
        }
        .login-form-wrap .welcome-text h2 {
            font-family: 'Nunito', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .login-form-wrap .welcome-text p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .login-form .form-group {
            margin-bottom: 16px;
        }
        .login-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .login-form .input-icon-wrap {
            position: relative;
        }
        .login-form .input-icon-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            z-index: 2;
            pointer-events: none;
        }
        .login-form .input-icon-wrap .form-input {
            padding-left: 44px;
            padding-top: 11px;
            padding-bottom: 11px;
            background: var(--gray-50);
            border: 1.5px solid var(--border-glass-strong);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all var(--transition);
        }
        .login-form .input-icon-wrap .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
            background: #FFFDF9;
        }
        .login-form .input-icon-wrap .form-input::placeholder {
            color: var(--text-muted);
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            opacity: 0.4;
            transition: opacity 0.2s;
            z-index: 2;
            line-height: 1;
        }
        .toggle-password:hover { opacity: 0.8; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px var(--primary-glow);
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 35%, transparent);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-error {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
            border: 1px solid var(--danger-bg);
        }
        .login-error.show { display: block; }
        .forgot-row { text-align: center; margin-top: 14px; }
        .forgot-link {
            background: none;
            border: none;
            color: var(--primary-dark, #E14C42);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* Forgot-password modal */
        .fp-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 36, 32, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .fp-overlay.show { display: flex; }
        .fp-modal {
            width: 90%;
            max-width: 400px;
            background: #FFFDF9;
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: 0 24px 80px color-mix(in srgb, var(--primary) 25%, transparent);
            animation: slideUp 0.3s ease;
        }
        .fp-modal h3 {
            font-family: 'Nunito', sans-serif;
            font-size: 19px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 6px;
        }
        .fp-modal .fp-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 18px;
            line-height: 1.5;
        }
        .fp-modal .fp-msg {
            display: none;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 14px;
        }
        .fp-modal .fp-msg.ok { display: block; background: #E7F6EC; color: #1E7A3C; }
        .fp-modal .fp-msg.err { display: block; background: var(--danger-bg); color: var(--danger); }
        .fp-actions { display: flex; gap: 10px; margin-top: 16px; }
        .fp-actions .login-btn { margin-top: 0; flex: 1; }
        .fp-cancel {
            flex: 0 0 auto;
            padding: 12px 18px;
            background: none;
            border: 1.5px solid var(--border-glass-strong);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .fp-cancel:hover { background: var(--gray-50); }

        /* ===== Animated 3D scene ===== */
        .login-3d {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            perspective: 1000px;
            transition: transform 0.4s ease-out;
        }
        .login-page { z-index: 1; }
        .l3d-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(4px);
            will-change: transform;
        }
        .l3d-orb.o1 { width: 260px; height: 260px; left: 6%; top: 16%;
            background: radial-gradient(circle at 32% 28%, var(--primary-light), var(--primary));
            opacity: 0.5; animation: floatA 9s ease-in-out infinite; }
        .l3d-orb.o3 { width: 340px; height: 340px; right: 4%; bottom: 6%;
            background: radial-gradient(circle at 32% 28%, #ffdca6, var(--accent, #E8930C));
            opacity: 0.38; animation: floatA 14s ease-in-out infinite reverse; }
        .l3d-paw {
            position: absolute;
            font-size: 46px;
            color: var(--primary);
            opacity: 0.22;
            will-change: transform;
        }
        .l3d-paw.p1 { left: 9%; top: 22%; color: var(--primary); animation: floatB 10s ease-in-out infinite; }
        .l3d-paw.p2 { right: 14%; top: 14%; font-size: 32px; color: var(--secondary, #4FA8DE); opacity: 0.2; animation: floatA 12s ease-in-out infinite; }
        .l3d-paw.p3 { right: 8%; bottom: 18%; font-size: 60px; color: var(--accent, #E8930C); opacity: 0.18; animation: floatB 13s ease-in-out infinite reverse; }
        .l3d-paw.p4 { left: 18%; bottom: 12%; font-size: 30px; animation: floatA 8s ease-in-out infinite; }
        .l3d-paw.p5 { left: 42%; top: 8%; font-size: 24px; opacity: 0.16; animation: floatB 9.5s ease-in-out infinite reverse; }
        .l3d-shape {
            position: absolute;
            opacity: 0.2;
            will-change: transform;
        }
        .l3d-shape svg { display: block; }
        .l3d-shape.bone1 { left: 26%; top: 12%; width: 54px; transform: rotate(-18deg); animation: floatA 11s ease-in-out infinite; }
        .l3d-shape.bone2 { right: 22%; bottom: 10%; width: 40px; transform: rotate(24deg); animation: floatB 12.5s ease-in-out infinite reverse; }
        .l3d-shape.fish1 { left: 7%; bottom: 30%; width: 52px; transform: rotate(12deg); animation: floatB 10.5s ease-in-out infinite; }
        .l3d-shape.fish2 { right: 6%; top: 34%; width: 44px; transform: rotate(-10deg); animation: floatA 13s ease-in-out infinite reverse; }
        @keyframes floatA {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(0, -30px, 40px) rotate(8deg); }
        }
        @keyframes floatB {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(22px, 26px, -30px); }
        }
        @keyframes spinRing {
            0% { transform: rotateX(62deg) rotateZ(0deg); }
            100% { transform: rotateX(62deg) rotateZ(360deg); }
        }
        /* gentle 3D tilt on the logo */
        .login-brand .brand-icon {
            transform-style: preserve-3d;
            animation: logoTilt 6s ease-in-out infinite;
        }
        @keyframes logoTilt {
            0%, 100% { transform: perspective(600px) rotateY(-13deg) rotateX(6deg); }
            50% { transform: perspective(600px) rotateY(13deg) rotateX(-4deg); }
        }
        .login-container { transition: transform 0.4s ease-out; transform-style: preserve-3d; }
        @media (prefers-reduced-motion: reduce) {
            .l3d-orb, .l3d-ring, .login-brand .brand-icon { animation: none; }
        }
        @media (max-width: 768px) {
            .login-container { flex-direction: column; max-width: 420px; }
            .login-brand { padding: 32px 28px; min-height: 200px; }
            .login-brand .brand-features { display: none; }
            .login-form-wrap { padding: 32px 28px; }
            .login-brand h1 { font-size: 26px; }
            .pet-illustration { width: 72px; top: 14px; right: 14px; bottom: auto; left: auto; opacity: 0.85; }
        }
    </style>

                    <g>
                        <ellipse cx="171" cy="196" rx="13" ry="11" fill="#9BD4E4"/>

            <div class="login-form-wrap">
                <div class="welcome-text">
                    <h2><span class="skel-reveal skel-reveal-inline">Welcome back!</span></h2>
                    <p><span class="skel-reveal skel-reveal-inline">Sign in to manage your pet shop</span></p>
                </div>
                <div id="loginError" class="login-error"></div>
                <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-icon-wrap">
                            <span class="input-icon"><span class="material-symbols-outlined" style="font-size:18px;">pets</span></span>
                            <input type="text" class="form-input" id="username" placeholder="Enter your username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon-wrap">
                            <span class="input-icon"><span class="material-symbols-outlined" style="font-size:18px;">lock</span></span>
                            <input type="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword" tabindex="-1" aria-label="Toggle password visibility"><span class="material-symbols-outlined" style="font-size:18px;">visibility</span></button>
                        </div>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                    <div class="forgot-row">
                        <button type="button" class="forgot-link" id="forgotLink">Forgot password?</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="fp-overlay" id="fpOverlay">
        <div class="fp-modal" role="dialog" aria-modal="true" aria-labelledby="fpTitle">
            <h3 id="fpTitle">Reset your password</h3>
            <p class="fp-sub">Enter your username or email and we'll send a reset link to the email on your account.</p>
            <div class="fp-msg" id="fpMsg"></div>
            <form id="fpForm" class="login-form">
                <div class="form-group">
                    <div class="input-icon-wrap">
                        <span class="input-icon"><span class="material-symbols-outlined" style="font-size:18px;">alternate_email</span></span>
                        <input type="text" class="form-input" id="fpUsername" placeholder="Username or email" required autocomplete="username">
                    </div>
                </div>
                <div class="fp-actions">
                    <button type="button" class="fp-cancel" id="fpCancel">Cancel</button>
                    <button type="submit" class="login-btn" id="fpSubmit">Send Reset Link</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        async function resendVerification(username) {
            const errorEl = document.getElementById('loginError');
            errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">outgoing_mail</span> Sending a new confirmation link...';
            try {
                const res = await fetch(API_BASE + '/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">mark_email_read</span> ' +
                    escapeHtml(data.message || 'If that account still needs confirming, a new link is on its way.');
            } catch (err) {
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> Connection error. Please try again.';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success && data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    // Auth cookie is set by the server as HttpOnly on login
                    window.location.href = 'dashboard.html';
                } else if (data.code === 'EMAIL_NOT_VERIFIED') {
                    // Password was right — the only thing missing is the click,
                    // so offer to send the link again instead of a dead end.
                    errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">mark_email_unread</span> ' +
                        escapeHtml(data.message) +
                        ' <a href="#" id="resendVerifyLink" style="color:inherit;font-weight:700;text-decoration:underline;">Resend it</a>';
                    errorEl.classList.add('show');
                    document.getElementById('resendVerifyLink').addEventListener('click', function (ev) {
                        ev.preventDefault();
                        resendVerification(username);
                    });
                } else {
                    errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> ' + escapeHtml(data.message || 'Invalid username or password');
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> Connection error. Please try again.';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initSkeletonReveal(700);
        });

        // Mouse parallax: the orb layer drifts and the card tilts subtly in 3D.
        (function () {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (!window.matchMedia || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
            var scene = document.getElementById('login3d');
            var card = document.querySelector('.login-container');
            var cardReady = false;
            setTimeout(function () { cardReady = true; }, 700); // let the slide-up finish
            window.addEventListener('mousemove', function (e) {
                var cx = (e.clientX / window.innerWidth) - 0.5;
                var cy = (e.clientY / window.innerHeight) - 0.5;
                if (scene) scene.style.transform = 'translate3d(' + (cx * -26).toFixed(1) + 'px,' + (cy * -26).toFixed(1) + 'px,0)';
                if (card && cardReady) card.style.transform = 'perspective(1300px) rotateY(' + (cx * 4).toFixed(2) + 'deg) rotateX(' + (cy * -4).toFixed(2) + 'deg)';
            });
        })();

        // Forgot-password modal
        (function () {
            var overlay = document.getElementById('fpOverlay');
            var msg = document.getElementById('fpMsg');
            var input = document.getElementById('fpUsername');
            var submit = document.getElementById('fpSubmit');

            document.getElementById('forgotLink').addEventListener('click', function () {
                msg.className = 'fp-msg';
                input.value = document.getElementById('username').value;
                overlay.classList.add('show');
                input.focus();
            });
            function closeModal() { overlay.classList.remove('show'); }
            document.getElementById('fpCancel').addEventListener('click', closeModal);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

            document.getElementById('fpForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.className = 'fp-msg';
                submit.disabled = true;
                submit.textContent = 'Sending...';
                try {
                    var res = await fetch(API_BASE + '/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: input.value.trim() })
                    });
                    var data = await res.json();
                    msg.textContent = data.message || 'If that account exists, a reset link has been sent.';
                    msg.className = 'fp-msg ' + (data.success ? 'ok' : 'err');
                } catch (err) {
                    msg.textContent = 'Connection error. Please try again.';
                    msg.className = 'fp-msg err';
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Send Reset Link';
                }
            });
        })();

        document.getElementById('togglePassword').addEventListener('click', function() {
            var pw = document.getElementById('password');
            if (pw.type === 'password') {
                pw.type = 'text';
                this.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">visibility_off</span>';
            } else {
                pw.type = 'password';
                this.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">visibility</span>';
            }
        });
    </script>
