<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">

    <meta property="og:type" content="website">

    <meta property="og:title" content="FETCH · Sign In">
    <meta property="og:description" content="Sign in to FETCH — the inventory and point-of-sale system for Risha Pet Supplies.">
    <meta property="og:url" content="https://risha-pets.onrender.com/login.html">
    <meta property="og:image" content="https://risha-pets.onrender.com/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <title>FETCH · Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css?v=21">
    <style>
        /* Sign-in. One card, the shop's own mark, nothing that moves. */
        body { display: block; background: var(--bg-body); }

        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            padding: 28px 28px 24px;
        }

        .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .login-brand img { width: 44px; height: 44px; border-radius: var(--radius-lg); display: block; }
        .login-brand-name { font-size: 16px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
        .login-brand-sub { font-size: 13px; color: var(--text-muted); }

        .login-container h1 { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.2px; }
        .login-lead { font-size: 13.5px; color: var(--text-muted); margin: 2px 0 18px; }

        .login-form .form-group { margin-bottom: 14px; }
        .login-form label.field-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 5px; }

        .input-wrap { position: relative; }
        .login-form .form-input { height: 38px; padding: 0 10px; font-size: 14px; }
        .input-wrap .form-input { padding-right: 38px; }

        .toggle-password {
            position: absolute; right: 4px; top: 4px;
            width: 30px; height: 30px;
            border: none; background: none; cursor: pointer;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
        }
        .toggle-password:hover { background: var(--gray-100); color: var(--text-primary); }

        .login-error {
            display: none;
            border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
            background: var(--danger-bg);
            color: var(--danger);
            border-radius: var(--radius-md);
            padding: 9px 12px;
            font-size: 13.5px;
            line-height: 1.45;
            margin-bottom: 14px;
        }
        .login-error.show { display: block; }
        .login-error .material-symbols-outlined { vertical-align: -3px; margin-right: 2px; }

        .remember-row { display: flex; gap: 9px; align-items: flex-start; margin: 2px 0 18px; cursor: pointer; }
        .remember-row input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--primary); flex-shrink: 0; }
        .remember-text { font-size: 13.5px; color: var(--text-primary); line-height: 1.4; }
        .remember-text small { display: block; font-size: 12.5px; color: var(--text-muted); }

        .login-btn {
            width: 100%;
            height: 38px;
            border: 1px solid var(--primary);
            border-radius: var(--radius-md);
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .login-btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .forgot-row { text-align: center; margin-top: 14px; }
        .forgot-link, .fp-cancel {
            border: none; background: none; cursor: pointer;
            font: inherit; font-size: 13.5px;
            color: var(--primary);
        }
        .forgot-link:hover { text-decoration: underline; }

        .login-foot { margin-top: 16px; font-size: 12.5px; color: var(--text-muted); text-align: center; }

        /* Reset-password dialog */
        .fp-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(21, 24, 28, 0.45);
            align-items: center; justify-content: center;
            padding: 16px;
            z-index: 100;
        }
        .fp-overlay.show { display: flex; }
        .fp-modal {
            width: 100%; max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
            padding: 22px 24px;
        }
        .fp-modal h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .fp-sub { font-size: 13.5px; color: var(--text-muted); margin: 4px 0 14px; line-height: 1.5; }
        .fp-modal .fp-msg { display: none; border-radius: var(--radius-md); padding: 9px 12px; font-size: 13.5px; margin-bottom: 12px; }
        .fp-modal .fp-msg.ok { display: block; background: var(--success-bg); color: var(--success); }
        .fp-modal .fp-msg.err { display: block; background: var(--danger-bg); color: var(--danger); }
        .fp-actions { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 4px; }
        .fp-actions .login-btn { width: auto; padding: 0 14px; }
        .fp-cancel { color: var(--text-secondary); }
    </style>
<script>/* login page is always light-themed */document.documentElement.classList.remove('dark-mode');if(localStorage.getItem('sidebarHidden')==='true')document.documentElement.classList.add('sidebar-hidden');if(!sessionStorage.getItem('authToken')&&!localStorage.getItem('authToken'))document.cookie='token=;path=/;max-age=0';try{var _av=JSON.parse(localStorage.getItem('accentVars2')||'null');if(_av){for(var _k in _av)document.documentElement.style.setProperty(_k,_av[_k]);}}catch(e){}var _ts=localStorage.getItem('textScale');if(_ts&&_ts!=='1')document.documentElement.style.zoom=_ts;try{var _fv=JSON.parse(localStorage.getItem('fontVars2')||'null');if(_fv){for(var _f in _fv)document.documentElement.style.setProperty(_f,_fv[_f]);}}catch(e){}</script>
    </head>
<body>
    <div class="login-page">
        <main class="login-container">
            <div class="login-brand">
                <img src="images/logo.jpeg" alt="Risha Pet Supplies">
                <div>
                    <div class="login-brand-name">Risha Pet Supplies</div>
                    <div class="login-brand-sub">FETCH inventory and sales</div>
                </div>
            </div>
            <h1>Sign in</h1>
            <p class="login-lead">Use the account your administrator gave you.</p>
            <div id="loginError" class="login-error" role="alert"></div>
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="field-label" for="username">Username</label>
                    <input type="text" class="form-input" id="username" required autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label class="field-label" for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" class="form-input" id="password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show or hide password"><span class="material-symbols-outlined" style="font-size:18px;">visibility</span></button>
                    </div>
                </div>
                <label class="remember-row" for="rememberMe">
                    <input type="checkbox" id="rememberMe">
                    <span class="remember-text">Keep me signed in
                        <small>Leave this off on a shared till. The session then ends when the browser closes.</small>
                    </span>
                </label>
                <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
                <div class="forgot-row">
                    <button type="button" class="forgot-link" id="forgotLink">Forgot your password?</button>
                </div>
            </form>
        </main>
        <p class="login-foot">Trouble signing in? Ask the shop administrator to reset your account.</p>
    </div>
    <div class="fp-overlay" id="fpOverlay">
        <div class="fp-modal" role="dialog" aria-modal="true" aria-labelledby="fpTitle">
            <h3 id="fpTitle">Reset your password</h3>
            <p class="fp-sub">Enter your username or email and we'll send a reset link to the email on your account.</p>
            <div class="fp-msg" id="fpMsg"></div>
            <form id="fpForm" class="login-form">
                <div class="form-group">
                    <label class="field-label" for="fpUsername">Username or email</label>
                    <input type="text" class="form-input" id="fpUsername" required autocomplete="username">
                </div>
                <div class="fp-actions">
                    <button type="button" class="fp-cancel" id="fpCancel">Cancel</button>
                    <button type="submit" class="login-btn" id="fpSubmit">Send reset link</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        async function resendVerification(username) {
            const errorEl = document.getElementById('loginError');
            errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">outgoing_mail</span> Sending a new confirmation link...';
            try {
                const res = await fetch(API_BASE + '/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">mark_email_read</span> ' +
                    escapeHtml(data.message || 'If that account still needs confirming, a new link is on its way.');
            } catch (err) {
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> Connection error. Please try again.';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const remember = !!document.getElementById('rememberMe')?.checked;
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });
                const data = await response.json();
                if (data.success && data.token) {
                    // Unticked, the session lives in sessionStorage and dies with
                    // the browser. Ticked, it persists. The server matches this
                    // for its own cookie, so the two cannot disagree.
                    setToken(data.token, remember, data.user);
                    window.location.href = roleHome(data.user && data.user.role);
                } else if (data.code === 'EMAIL_NOT_VERIFIED') {
                    // Password was right — the only thing missing is the click,
                    // so offer to send the link again instead of a dead end.
                    errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">mark_email_unread</span> ' +
                        escapeHtml(data.message) +
                        ' <a href="#" id="resendVerifyLink" style="color:inherit;font-weight:700;text-decoration:underline;">Resend it</a>';
                    errorEl.classList.add('show');
                    document.getElementById('resendVerifyLink').addEventListener('click', function (ev) {
                        ev.preventDefault();
                        resendVerification(username);
                    });
                } else {
                    errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> ' + escapeHtml(data.message || 'Invalid username or password');
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">error</span> Connection error. Please try again.';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }

        // Forgot-password modal
        (function () {
            var overlay = document.getElementById('fpOverlay');
            var msg = document.getElementById('fpMsg');
            var input = document.getElementById('fpUsername');
            var submit = document.getElementById('fpSubmit');

            document.getElementById('forgotLink').addEventListener('click', function () {
                msg.className = 'fp-msg';
                input.value = document.getElementById('username').value;
                overlay.classList.add('show');
                input.focus();
            });
            function closeModal() { overlay.classList.remove('show'); }
            document.getElementById('fpCancel').addEventListener('click', closeModal);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

            document.getElementById('fpForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.className = 'fp-msg';
                submit.disabled = true;
                submit.textContent = 'Sending...';
                try {
                    var res = await fetch(API_BASE + '/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: input.value.trim() })
                    });
                    var data = await res.json();
                    msg.textContent = data.message || 'If that account exists, a reset link has been sent.';
                    msg.className = 'fp-msg ' + (data.success ? 'ok' : 'err');
                } catch (err) {
                    msg.textContent = 'Connection error. Please try again.';
                    msg.className = 'fp-msg err';
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Send reset link';
                }
            });
        })();

        document.getElementById('togglePassword').addEventListener('click', function() {
            var pw = document.getElementById('password');
            if (pw.type === 'password') {
                pw.type = 'text';
                this.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">visibility_off</span>';
            } else {
                pw.type = 'password';
                this.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">visibility</span>';
            }
        });
    </script>
        <script src="js/format.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js?v=22"></script>
<script>/* login page is always light-themed, undo auth.js theme apply */document.documentElement.classList.remove('dark-mode');</script>
<script src="js/motion.js?v=20"></script>
</body>
</html>
