<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISHA PET SUPPLIES</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
        }

        .login-glass {
            background: rgba(8, 13, 22, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 36px 40px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 60px rgba(0, 212, 170, 0.03);
            animation: slideUp 0.5s ease;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--accent-cyan), #00a88a);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .login-title h1 span { color: var(--accent-cyan); }

        .login-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .login-form .form-group {
            margin-bottom: 16px;
        }

        .login-form .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .login-form .input-icon-wrap {
            position: relative;
        }

        .login-form .input-icon-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            z-index: 2;
            pointer-events: none;
        }

        .login-form .input-icon-wrap .form-input {
            padding-left: 40px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            padding-top: 10px;
            padding-bottom: 10px;
            transition: all var(--transition);
        }

        .login-form .input-icon-wrap .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .login-form .input-icon-wrap .form-input::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            opacity: 0.4;
            transition: opacity 0.2s;
            z-index: 2;
            line-height: 1;
        }

        .toggle-password:hover { opacity: 0.8; }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--accent-cyan), #00a88a);
            color: var(--bg-deep);
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-sans);
            box-shadow: 0 2px 12px rgba(0, 212, 170, 0.2);
            margin-top: 4px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3);
        }

        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .login-error {
            background: var(--accent-rose-dim);
            color: var(--accent-rose);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(255, 64, 96, 0.15);
        }

        .login-error.show { display: block; }

        .login-footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-glass">
            <div class="login-logo"><img src="images/logo.jpeg" alt="RISHA"></div>
            <div class="login-title">
                <h1>RISHA <span>Pet Supplies</span></h1>
                <p>Inventory & Sales Management</p>
            </div>
            <div id="loginError" class="login-error"></div>
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-input" id="username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" id="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" tabindex="-1" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
            </form>
            <div class="login-footer-text">RISHA Pet Supplies Management System</div>
        </div>
    </div>
    <script>
        const API_BASE = '/api';

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success && data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorEl.textContent = data.message || 'Invalid username or password';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        if (localStorage.getItem('authToken')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            var pw = document.getElementById('password');
            if (pw.type === 'password') {
                pw.type = 'text';
                this.textContent = '🙈';
            } else {
                pw.type = 'password';
                this.textContent = '👁️';
            }
        });
    </script>
</body>
</html>
