<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="description" content="Confirm your FETCH account email address.">
    <meta name="robots" content="noindex">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FETCH · Risha Pet Supplies">
    <meta property="og:title" content="FETCH · Confirm Email">
    <meta property="og:description" content="Confirm your FETCH account email address.">
    <meta property="og:url" content="https://risha-pets.onrender.com/verify-email.html">
    <meta property="og:image" content="https://risha-pets.onrender.com/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Risha Pet Supplies logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETCH · Confirm Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css?v=10">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDD 45%, #FDE4CE 100%);
            font-family: 'Inter', sans-serif;
        }
        .verify-card {
            width: 90%;
            max-width: 440px;
            background: #FFFDF9;
            border-radius: var(--radius-xl);
            box-shadow: 0 24px 80px rgba(224, 101, 91, 0.14);
            overflow: hidden;
            position: relative;
            animation: slideUp 0.6s ease;
        }
        .shop-awning {
            position: relative;
            height: 18px;
            background: repeating-linear-gradient(90deg, #EE6A5F 0 40px, #FFF6EE 40px 80px);
        }
        .shop-awning::after {
            content: '';
            position: absolute;
            top: 18px; left: 0; right: 0;
            height: 13px;
            background-image:
                radial-gradient(circle at 20px 0px, #EE6A5F 12px, transparent 12.5px),
                radial-gradient(circle at 60px 0px, #FFF6EE 12px, transparent 12.5px);
            background-size: 80px 13px;
            background-repeat: repeat-x;
            filter: drop-shadow(0 2px 3px rgba(224, 101, 91, 0.18));
            z-index: 2;
        }
        .verify-body { padding: 38px 34px 34px; text-align: center; }
        .paw-badge {
            width: 54px; height: 54px;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FFB09E, #EE6A5F);
            display: flex; align-items: center; justify-content: center;
            color: white;
            transition: background 0.3s ease;
        }
        .paw-badge.ok { background: linear-gradient(135deg, #63C08C, #2FA36B); }
        .paw-badge.err { background: linear-gradient(135deg, #F0918A, #D0473C); }
        .verify-body h1 {
            font-family: 'Nunito', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
        }
        .verify-body p.lead {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 8px 0 0;
            line-height: 1.6;
        }
        .spinner {
            width: 22px; height: 22px;
            margin: 18px auto 0;
            border: 2.5px solid var(--primary-bg);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .verify-btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 22px;
            padding: 12px;
            background: linear-gradient(135deg, #F28B82, #E0655B);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .verify-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255, 181, 167, 0.35); }
        .back-link { margin-top: 18px; }
        .back-link a {
            color: var(--primary-dark, #E14C42);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link a:hover { text-decoration: underline; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>/* standalone public page — always light-themed */document.documentElement.classList.remove('dark-mode');</script>
</head>
<body>
    <div class="verify-card">
        <div class="shop-awning" aria-hidden="true"></div>
        <div class="verify-body">
            <div class="paw-badge" id="verifyBadge"><span class="material-symbols-outlined" id="verifyIcon" style="font-size:28px;">mark_email_unread</span></div>
            <h1 id="verifyTitle">Confirming your email…</h1>
            <p class="lead" id="verifyText">One moment while we check your confirmation link.</p>
            <div class="spinner" id="verifySpinner"></div>
            <a class="verify-btn" id="verifyAction" href="login.html" style="display:none;">Go to sign in</a>
            <div class="back-link" id="verifyBack" style="display:none;"><a href="login.html">&larr; Back to sign in</a></div>
        </div>
    </div>
    <script>
        var API_BASE = '/api';
        var token = new URLSearchParams(window.location.search).get('token');
        var badge = document.getElementById('verifyBadge');
        var icon = document.getElementById('verifyIcon');
        var title = document.getElementById('verifyTitle');
        var text = document.getElementById('verifyText');
        var spinner = document.getElementById('verifySpinner');
        var action = document.getElementById('verifyAction');
        var back = document.getElementById('verifyBack');

        function settle(kind, iconName, heading, body, showButton) {
            spinner.style.display = 'none';
            badge.className = 'paw-badge ' + kind;
            icon.textContent = iconName;
            title.textContent = heading;
            text.textContent = body;
            if (showButton) action.style.display = 'inline-block';
            else back.style.display = 'block';
        }

        (async function () {
            if (!token) {
                settle('err', 'link_off', 'This link is incomplete',
                    'The confirmation link is missing its token. Open the link straight from your email, or ask an administrator to send a new one.', false);
                return;
            }
            try {
                var res = await fetch(API_BASE + '/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                var data = await res.json();
                if (data.success) {
                    settle('ok', 'mark_email_read', 'Email confirmed',
                        'Your address is verified. You can now sign in to FETCH with your username and password.', true);
                } else {
                    settle('err', 'link_off', 'We could not confirm this link',
                        data.message || 'This confirmation link is invalid or has expired.', false);
                }
            } catch (err) {
                settle('err', 'wifi_off', 'Connection problem',
                    'We could not reach the server. Check your connection and open the link again.', false);
            }
        })();
    </script>
</body>
</html>
